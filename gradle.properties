android.useAndroidX=true

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4096m
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configureondemand=true
org.gradle.tooling.parallel=true
org.gradle.unsafe.isolated-projects=true

kotlin.incremental=true

ksp.incremental=true
ksp.useKSP2=true

# === 国内网络 / 本地构建环境（见 android-gradle-build/SKILL.md）===
# 代理：本机 Clash 默认端口 7897。代理未开启时必须注释掉下面四行，否则依赖解析会失败。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897

# Gradle 守护进程使用的 JDK：必须是 OpenJDK / Temurin / JBR，禁止 GraalVM，禁止 JDK 8/11。
# 本项目 kotlin { jvmToolchain(21) } + AGP 9.4.1，所以固定成 JDK 21，避免 Gradle 再去下载 toolchain。
org.gradle.java.home=F:/soft/microsoft-jdk-21.0.11-windows-x64/jdk-21.0.11+10
